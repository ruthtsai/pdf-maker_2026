<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF／影像合併與轉換工具</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/editor.css" />
</head>
<body>
<header class="app-header">
  <h1>PDF／影像合併與轉換工具</h1>
  <p class="subtitle">完全本機處理，不會上傳任何資料</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="merge">合併</button>
  <button class="tab-btn" data-tab="convert">PDF 轉影像</button>
  <button class="tab-btn" data-tab="edit">編輯頁面</button>
  <button class="tab-btn" data-tab="form">填寫表單</button>
</nav>

<main>
  <!-- ============ 合併頁籤 ============ -->
  <section id="tab-merge" class="tab-panel active">
    <div id="merge-dropzone" class="dropzone">
      <p>拖曳 PDF／JPG／PNG 檔案到這裡，或</p>
      <button id="merge-add-btn" class="btn">新增檔案</button>
      <input id="merge-file-input" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" hidden />
    </div>

    <ul id="merge-file-list" class="file-list"></ul>

    <div class="options-row">
      <label>輸出頁面尺寸
        <select id="opt-page-size">
          <option value="original">沿用原尺寸</option>
          <option value="a4">統一縮放為 A4</option>
        </select>
      </label>
      <label>影像頁面邊界
        <select id="opt-image-fit">
          <option value="center">留白置中</option>
          <option value="fill">滿版</option>
        </select>
      </label>
      <label>輸出檔名
        <input id="merge-output-name" type="text" value="merged.pdf" />
      </label>
    </div>

    <div class="action-row">
      <button id="merge-start-btn" class="btn btn-primary" disabled>開始合併</button>
      <label id="merge-save-as-row" class="save-as-toggle hidden">
        <input id="merge-save-as" type="checkbox" />
        另存為（選擇儲存位置）
      </label>
    </div>

    <div id="merge-progress" class="progress-area hidden">
      <div class="progress-bar"><div class="progress-bar-fill"></div></div>
      <span class="progress-label"></span>
      <button class="btn btn-cancel">取消</button>
    </div>

    <div id="merge-result" class="result-area hidden"></div>
  </section>

  <!-- ============ 轉換頁籤 ============ -->
  <section id="tab-convert" class="tab-panel">
    <div class="dropzone" id="convert-dropzone">
      <p>拖曳單一 PDF 檔案到這裡，或</p>
      <button id="convert-add-btn" class="btn">選擇 PDF</button>
      <input id="convert-file-input" type="file" accept=".pdf" hidden />
    </div>

    <div id="convert-info" class="pdf-info hidden"></div>

    <div class="options-row">
      <label>頁碼範圍（例如 1-5,8,10-12，留空表示全部）
        <input id="opt-page-range" type="text" placeholder="全部頁面" />
      </label>
      <label>輸出格式
        <select id="opt-format">
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
        </select>
      </label>
      <label>解析度（DPI，72–600）
        <input id="opt-dpi" type="number" min="72" max="600" value="200" />
      </label>
      <label id="opt-jpg-quality-label" class="hidden">JPG 品質（1–100）
        <input id="opt-jpg-quality" type="number" min="1" max="100" value="90" />
      </label>
      <label>輸出方式
        <select id="opt-output-mode">
          <option value="separate">各自存檔</option>
          <option value="zip">打包成 ZIP</option>
        </select>
      </label>
    </div>

    <div class="action-row">
      <button id="convert-start-btn" class="btn btn-primary" disabled>開始轉換</button>
      <label id="convert-save-as-row" class="save-as-toggle hidden">
        <input id="convert-save-as" type="checkbox" />
        另存為（選擇儲存位置）
      </label>
    </div>

    <div id="convert-progress" class="progress-area hidden">
      <div class="progress-bar"><div class="progress-bar-fill"></div></div>
      <span class="progress-label"></span>
      <button class="btn btn-cancel">取消</button>
    </div>

    <div id="convert-result" class="result-area hidden"></div>
  </section>

  <!-- ============ 編輯頁面頁籤 ============ -->
  <section id="tab-edit" class="tab-panel">
    <div id="edit-dropzone" class="dropzone">
      <p>拖曳要編輯的 PDF 到這裡，或</p>
      <button id="edit-add-btn" class="btn">選擇 PDF</button>
      <input id="edit-file-input" type="file" accept=".pdf" hidden />
    </div>

    <div id="edit-info" class="pdf-info hidden"></div>

    <div id="edit-workspace" class="hidden">
      <div class="edit-toolbar" id="edit-toolbar">
        <span class="edit-status" id="edit-status"></span>
        <span class="toolbar-group">
          <button class="btn" id="edit-undo" title="還原 (Ctrl+Z)" disabled>↶ 還原</button>
          <button class="btn" id="edit-redo" title="重做 (Ctrl+Y)" disabled>↷ 重做</button>
        </span>
        <span class="toolbar-sep"></span>
        <span class="toolbar-group">
          <button class="btn" id="edit-select-all">全選</button>
          <button class="btn" id="edit-select-none">取消選取</button>
        </span>
        <span class="toolbar-sep"></span>
        <span class="toolbar-group">
          <button class="btn" id="edit-move-btn">移動頁面…</button>
          <button class="btn" id="edit-insert-btn">插入 PDF…</button>
          <button class="btn" id="edit-replace-btn">取代頁面…</button>
        </span>
        <span class="toolbar-sep"></span>
        <span class="toolbar-group">
          <button class="btn" id="edit-numbering-btn">頁碼…</button>
          <button class="btn" id="edit-bookmark-btn">書籤…</button>
          <button class="btn" id="edit-stamp-btn">蓋章…</button>
        </span>
        <span class="toolbar-sep"></span>
        <span class="toolbar-group" title="未選取任何頁面時，套用到整份文件">
          <span class="toolbar-label">旋轉</span>
          <button class="btn" data-rotate="90">↻ 90°</button>
          <button class="btn" data-rotate="180">180°</button>
          <button class="btn" data-rotate="270">↻ 270°</button>
        </span>
        <span class="toolbar-spacer"></span>
        <label id="edit-save-as-row" class="save-as-toggle hidden">
          <input id="edit-save-as" type="checkbox" />
          另存為（選擇儲存位置）
        </label>
        <button class="btn btn-primary" id="edit-export-btn">匯出新檔…</button>
      </div>
      <p class="edit-hint">點一下選取；Ctrl 複選、Shift 連選；拖曳縮圖可重新排序（多選時一起移動）；雙擊或按放大鏡預覽單頁。所有操作都只會輸出新檔，不會改動原檔。</p>
      <div id="edit-grid" class="page-grid"></div>
    </div>

    <div id="edit-progress" class="progress-area hidden">
      <div class="progress-bar"><div class="progress-bar-fill"></div></div>
      <span class="progress-label"></span>
      <button class="btn btn-cancel">取消</button>
    </div>

    <div id="edit-result" class="result-area hidden"></div>
  </section>

  <!-- ============ 填寫表單頁籤 ============ -->
  <section id="tab-form" class="tab-panel">
    <div id="form-dropzone" class="dropzone">
      <p>拖曳含表單欄位的 PDF 到這裡，或</p>
      <button id="form-add-btn" class="btn">選擇 PDF</button>
      <input id="form-file-input" type="file" accept=".pdf" hidden />
    </div>

    <div id="form-info" class="pdf-info hidden"></div>

    <div id="form-workspace" class="hidden">
      <div class="edit-toolbar">
        <span class="edit-status" id="form-status"></span>
        <label class="save-as-toggle"><input id="form-highlight" type="checkbox" checked /> 標示欄位位置</label>
        <span class="toolbar-spacer"></span>
        <button class="btn" id="form-reset-btn">還原填寫內容</button>
        <label id="form-save-as-row" class="save-as-toggle hidden">
          <input id="form-save-as" type="checkbox" />
          另存為（選擇儲存位置）
        </label>
        <button class="btn btn-primary" id="form-export-btn">匯出新檔…</button>
      </div>
      <p class="edit-hint">直接在頁面上填寫即可；匯出時可選擇保留可編輯，或攤平成不可再修改的文件。所有操作都只會輸出新檔，不會改動原檔。</p>
      <div id="form-pages" class="form-pages"></div>
    </div>

    <div id="form-progress" class="progress-area hidden">
      <div class="progress-bar"><div class="progress-bar-fill"></div></div>
      <span class="progress-label"></span>
      <button class="btn btn-cancel">取消</button>
    </div>

    <div id="form-result" class="result-area hidden"></div>
  </section>
</main>

<div id="error-toast" class="error-toast hidden"></div>

<script src="/app.js"></script>
<script src="/editor.js"></script>
<script src="/forms.js"></script>
</body>
</html>
